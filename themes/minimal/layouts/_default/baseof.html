<!DOCTYPE html>
<html lang="{{ .Site.LanguageCode | default "de" }}">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{ .Title }}</title>
    <style>
        :root {
            --foreground: #2d3748;
            --muted-foreground: #4a5568;
            --accent: #FF6B35;
            --border: #e2e8f0;
            --card: #ffffff;
        }
        * {
            box-sizing: border-box;
        }
        body {
            font-family: system-ui, -apple-system, sans-serif;
            margin: 0;
            padding: 0;
            color: var(--foreground);
            background: var(--card);
            line-height: 1.6;
        }
        a {
            color: var(--accent);
            text-decoration: none;
        }
        a:hover {
            text-decoration: underline;
        }
        .container {
            max-width: 800px;
            margin: 0 auto;
            padding: 20px;
        }
        h1, h2, h3 {
            color: var(--accent);
            margin-top: 1.5em;
            margin-bottom: 0.5em;
        }
        h1 { font-size: 2rem; }
        h2 { font-size: 1.5rem; }
        h3 { font-size: 1.25rem; }
        p {
            margin-bottom: 1em;
        }
        .meta {
            color: var(--muted-foreground);
            font-size: 0.875rem;
            margin-bottom: 20px;
        }
        .lang-switch {
            margin-top: 20px;
            padding-top: 20px;
            border-top: 1px solid var(--border);
        }
        .content p code {
            background: #e2e8f0;
            padding: 0.2em 0.4em;
            border-radius: 3px;
        }
        .section {
            margin-bottom: 40px;
            padding-bottom: 20px;
            border-bottom: 1px solid var(--border);
        }
        @media (max-width: 600px) {
            .container { padding: 10px; }
        }
    </style>
</head>
<body>
    <div class="container">
        {{ block "main" . }}{{ end }}
        {{ if .IsPage }}<div class="meta">{{ .Date.Format "2006-01-02" }} — {{ .File.Path }}</div>{{ end }}
        <div class="lang-switch">
            {{ $langs := .Site.Languages }}
            {{ range $langs }}
                <a href="{{ $.Site.BaseURL }}{{ .RelPermalink }}" style="margin-right: 10px; color: var(--muted-foreground);">{{ .LanguageName }}</a>
            {{ end }}
        </div>
    </div>
</body>
</html>
